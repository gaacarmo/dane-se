# Render Blueprint: New > Blueprint, pick this repo, done.
# Free plan: sleeps after 15 min without traffic (~1 min to wake up) and
# in-memory rooms are lost on restart. See README for details.
# Profiles, wallets, friends and ranking: unless DATABASE_URL is set they live in
# a JSON file in `.data/`, which Render wipes on every redeploy/restart/sleep.
# Set DATABASE_URL and DATABASE_AUTH_TOKEN (Turso) to keep them; see README.
services:
  - type: web
    name: dane-se
    runtime: node
    plan: free
    # Closest Render region to Brazil (there is no South America region).
    region: virginia
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Turso (libSQL) database for profiles, wallets, friends and ranking.
      # `sync: false`: set the values in the Render dashboard, never in this file.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false
